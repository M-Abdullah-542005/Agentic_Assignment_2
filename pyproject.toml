[project]
name = "gigbid-student-project"
version = "0.1.0"
description = "Student scaffold for the AI-4016 GigBid assignment"
requires-python = ">=3.11"
dependencies = [
  # ── Web / API ──────────────────────────────────────────────────────────────
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.1",
  "python-multipart>=0.0.9",

  # ── Auth / Crypto ──────────────────────────────────────────────────────────
  "cryptography>=42.0.5",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",

  # ── Database ───────────────────────────────────────────────────────────────
  "psycopg[binary]>=3.1.19",
  "psycopg-pool>=3.2.2",

  # ── Task Queue / Cache ─────────────────────────────────────────────────────
  "arq>=0.26.1",
  "redis>=5.0.4",

  # ── LangGraph / LangChain ─────────────────────────────────────────────────
  "langgraph>=0.2.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  "langchain>=0.2.0",
  "langchain-core>=0.2.0",
  "langchain-mcp-adapters>=0.1.0",
  "mcp>=1.3.0",

  # ── RAG / ML ──────────────────────────────────────────────────────────────
  "numpy>=1.26.4",
  "rank-bm25>=0.2.2",

  # ── Utilities ─────────────────────────────────────────────────────────────
  "anyio>=4.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.6",
  "ruff>=0.4.4",
  "mypy>=1.10.0",
  "httpx>=0.27.0",   # for TestClient
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
