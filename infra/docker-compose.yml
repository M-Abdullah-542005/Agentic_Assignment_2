services:
  postgres: {image: "postgres:16", environment: {POSTGRES_USER: gigbid, POSTGRES_PASSWORD: gigbid, POSTGRES_DB: gigbid}, volumes: ["pg:/var/lib/postgresql/data"], healthcheck: {test: ["CMD-SHELL","pg_isready -U gigbid"], interval: 5s, retries: 10}}
  redis: {image: "redis:7"}
  marketplace:
    build: {context: .., dockerfile: apps/api/Dockerfile}
    command: ["python","-m","mcp_servers.marketplace.server","--port","8002"]
    env_file: ../.env
  api:
    build: {context: .., dockerfile: apps/api/Dockerfile}
    env_file: ../.env
    environment: {CORS_ORIGINS: "http://localhost:3000"}
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_started}, marketplace: {condition: service_started}}
  worker:
    build: {context: ../worker}
    env_file: ../.env
    depends_on: [redis, api]
  web:
    build: {context: ../apps/web}
    environment: {NEXT_PUBLIC_API: "http://localhost:8000"}
    ports: ["3000:3000"]
    depends_on: [api]
volumes: {pg: {}}
